<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Spood merch: mugs, tees, stickers and more for people who love spiders.">
<title>The Spood Shop</title>
<style>
:root{
  --ground:#FFE872;
  --ground-2:#FFF4B8;
  --paper:#FFFDF3;
  --ink:#2A1636;
  --ink-soft:#5B4768;
  --pink:#FF6FAE;
  --leaf:#2FAE6E;
  --sky:#7CCBFF;
  --line:#2A1636;
  --shadow:#2A1636;
  --web:rgba(42,22,54,.28);
  --display:"Bagel Fat One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Gaegu","Comic Sans MS","Chalkboard SE",cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#1C1026;
    --ground-2:#281838;
    --paper:#33214A;
    --ink:#FFF2C4;
    --ink-soft:#CDB9DD;
    --pink:#FF7DB7;
    --leaf:#4FD08E;
    --sky:#86D1FF;
    --line:#FFF2C4;
    --shadow:#0B0510;
    --web:rgba(255,242,196,.22);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#1C1026;
  --ground-2:#281838;
  --paper:#33214A;
  --ink:#FFF2C4;
  --ink-soft:#CDB9DD;
  --pink:#FF7DB7;
  --leaf:#4FD08E;
  --sky:#86D1FF;
  --line:#FFF2C4;
  --shadow:#0B0510;
  --web:rgba(255,242,196,.22);
}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;padding-inline:16px;overflow-x:hidden}
.wrap{max-width:1160px;margin-inline:auto}
h1{font-family:var(--display);font-weight:400;line-height:1.02;margin:0;text-wrap:balance;font-size:clamp(46px,7vw,84px)}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px dashed var(--pink);outline-offset:3px}
/* ---------- nav ---------- */
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px;flex-wrap:wrap}
.logo{display:flex;align-items:flex-start;gap:4px;text-decoration:none;font-family:var(--display);font-size:30px;letter-spacing:-.5px;position:relative}
.logo .dot{color:var(--pink)}
.logo-spood{width:34px;height:64px;margin-top:-18px;transform-origin:50% 0;animation:dangle 3.2s ease-in-out infinite}
@keyframes dangle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.nav-links{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nav-links a{text-decoration:none;font-weight:600;padding:6px 12px;border-radius:999px}
.nav-links a:hover{background:var(--ground-2)}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--display);font-size:18px;letter-spacing:.2px;
  background:var(--pink);color:#2A1636;border:2.5px solid var(--line);
  padding:10px 20px;border-radius:999px;cursor:pointer;text-decoration:none;
  box-shadow:4px 4px 0 var(--shadow);transition:transform .12s, box-shadow .12s;
}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.ghost{background:var(--paper);color:var(--ink)}

header.shop-head{padding-block:26px 34px;display:grid;gap:10px}
.shop-head .lede{font-size:19px;color:var(--ink-soft);max-width:52ch}
.shop-head .hand{font-family:var(--hand);font-size:22px;font-weight:700;color:var(--ink-soft);transform:rotate(-2deg);display:inline-block}
/* ---------- shop ---------- */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.item{background:var(--paper);border:2.5px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.item .shot{aspect-ratio:5/4;background:var(--bg);display:grid;place-items:center;border-bottom:2.5px solid var(--line);position:relative}
.item .shot svg{width:72%;height:82%}
.item .tag{position:absolute;top:12px;right:12px;background:var(--ground);color:#2A1636;border:2px solid #2A1636;border-radius:999px;padding:2px 10px;font-family:var(--hand);font-weight:700;font-size:17px;transform:rotate(5deg)}
.item .info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.item h4{margin:0;font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1}
.item p{font-size:15px;color:var(--ink-soft)}
.item .buy{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:6px}
.item .soon{font-family:var(--hand);font-weight:700;font-size:20px;color:var(--ink-soft)}
.item .price{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.more{margin-top:26px}
.item .btn{font-size:15px;padding:7px 14px;box-shadow:3px 3px 0 var(--shadow)}

footer{padding-block:60px 40px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-family:var(--hand);font-size:19px;color:var(--ink-soft)}
@media (max-width:480px){.nav-links a:not(.btn){display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav" aria-label="Main">
    <a class="logo" href="./" aria-label="sendspoods home">send<span class="dot">spoods</span>
      <svg class="logo-spood" viewBox="0 0 34 64" aria-hidden="true"></svg>
    </a>
    <div class="nav-links">
      <a href="./#gallery">Gallery</a>
      <a href="./#sotd">Spood of the Day</a>
      <a class="btn" href="./#send">Send a spood</a>
    </div>
  </nav>

  <header class="shop-head">
    <span class="hand">wear your spood pride</span>
    <h1>The Spood Shop</h1>
    <p class="lede">Mugs, tees, stickers and more for people who love their eight-legged friends. Everything here is coming soon. <a href="./#mail">Join Spood Mail</a> for first dibs.</p>
  </header>

  <div class="shop" id="shopGrid"></div>

  <footer>
    <a href="./">← back to sendspoods</a>
    <span>merch coming soon</span>
  </footer>
</div>
<script src="spood-art.js"></script>
<script>
(function(){
  document.getElementById('shopGrid').innerHTML=SpoodArt.products.map(SpoodArt.merchCard).join('');
  var el=document.querySelector('.logo-spood'), c=getComputedStyle(document.documentElement).getPropertyValue('--line').trim()||'#2A1636';
  el.innerHTML='<line x1="17" y1="0" x2="17" y2="40" stroke="'+c+'" stroke-width="1.5"/>'+
    '<g transform="translate(0,30) scale(.17)">'+SpoodArt.spoodSVG({body:c,accent:'#FF6FAE'}).replace(/^<svg[^>]*>|<\/svg>$/g,'')+'</g>';
})();
</script>
</body>
</html>
